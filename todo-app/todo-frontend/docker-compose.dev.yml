services:
  todo-frontend-dev:
    image: todo-frontend-dev
    build:
      context: .
      dockerfile: dev.Dockerfile

    working_dir: /usr/src/app

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

    ports:
      - "5173:5173"

    environment:
      - VITE_BACKEND_URL=http://localhost:3001

    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules